name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler téléphone + montre
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Renommer les APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FieldTracker-telephone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/FieldTracker-montre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTracker-apk
          path: out/*.apk

      - name: Publier (téléchargement direct)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FieldTracker – dernière version
          prerelease: false
          make_latest: true
          files: out/*.apk
